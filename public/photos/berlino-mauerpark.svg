<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5d67"/>
      <stop offset="1" stop-color="#20282e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#fff" stroke-width="2">
    <path d="M0 90 H400 M0 180 H400 M110 0 V300 M270 0 V300"/>
  </g>

  <g transform="translate(200 138) rotate(-7)" filter="url(#sh)">
    <rect x="-96" y="-62" width="192" height="124" rx="16" fill="#fdfdfb"/>
    <rect x="-96" y="-62" width="192" height="124" rx="16" fill="none" stroke="#e6e2d8" stroke-width="2"/>
    <circle cx="-56" cy="-4" r="27" fill="#e8482f"/>
    <text x="-56" y="6" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700"
          fill="#fff" text-anchor="middle">D</text>
    <text x="-18" y="-8" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800"
          fill="#1a1a1a">DARIO</text>
    <text x="-18" y="16" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600"
          fill="#e8482f" letter-spacing="2">WAS HERE</text>
    <text x="-18" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="11"
          fill="#8a8a8a">52.541 N  13.404 E</text>
  </g>

  <rect x="0" y="258" width="400" height="42" fill="#000" opacity="0.45"/>
  <text x="16" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600"
        fill="#fff">Berlino - Mauerpark</text>
</svg>
