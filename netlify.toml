[build]
  # Solo questa cartella finisce online. Prima era ".", quindi il sito pubblicava
  # anche netlify/, package.json e i documenti: il codice del backend era
  # scaricabile da chiunque, per esempio https://.../netlify/lib/auth.mjs
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Le rotte /api/* sono dichiarate dentro le funzioni stesse (export const config = { path }),
# quindi qui non serve nessun redirect.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"

    # Nessuno script inline: i gestori onerror sono stati spostati nel JS, quindi
    # non serve 'unsafe-inline' per gli script. Per gli stili sì, perché Leaflet
    # scrive attributi style sugli elementi mentre muove la mappa.
    #
    # challenges.cloudflare.com serve al captcha Turnstile: lo script, la chiamata
    # di verifica e l'iframe in cui disegna il widget. frame-src va indicata a parte
    # perché non eredita da default-src.
    Content-Security-Policy = """\
default-src 'self'; \
base-uri 'self'; \
object-src 'none'; \
frame-ancestors 'none'; \
form-action 'self'; \
frame-src https://challenges.cloudflare.com; \
script-src 'self' https://unpkg.com https://challenges.cloudflare.com; \
style-src 'self' 'unsafe-inline' https://unpkg.com; \
img-src 'self' data: blob: https://unpkg.com https://tile.openstreetmap.org https://*.tile.openstreetmap.fr; \
connect-src 'self' https://nominatim.openstreetmap.org https://challenges.cloudflare.com; \
upgrade-insecure-requests"""

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
